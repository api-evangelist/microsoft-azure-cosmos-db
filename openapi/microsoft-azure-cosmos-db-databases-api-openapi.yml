      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
      responses:
        '201':
          description: Database created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
  /dbs/{databaseId}:
    parameters:
    - name: databaseId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getDatabase
      summary: Cosmos DB Get database
      description: Retrieves a database.
